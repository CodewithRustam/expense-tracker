<div class="member-cards-rail">
  <div class="member-cards-track" role="tablist">
    <ng-container *ngIf="!isLoading; else membersSkeleton">
      <div class="member-tactile-card" *ngFor="let u of users"
           (click)="selectUser(u.memberId)"
           role="tab"
           [attr.aria-selected]="selectedUser === u.memberId"
           [class.is-selected]="selectedUser === u.memberId"
           [class.status-owe]="u.netBalance < 0 && u.badgeText !== 'Settled up'"
           [class.status-get]="u.netBalance >= 0 && u.badgeText !== 'Settled up'"
           [class.status-settled]="u.badgeText === 'Settled up'">

        <!-- Avatar with Halo Ring & Settled check -->
        <div class="member-avatar-wrapper">
          <div class="member-avatar-ring">
            <div class="member-avatar">{{ u.memberName | initials }}</div>
          </div>
          <div class="member-settled-check" *ngIf="u.badgeText === 'Settled up'">
            <i class="fa-solid fa-check"></i>
          </div>
        </div>

        <div class="member-meta-block">
          <span class="member-card-name" [title]="u.memberName">{{ u.memberName | firstName }}</span>
          <span *ngIf="u.badgeText === 'Settled up'" class="member-card-bal settled">Settled</span>
          <span *ngIf="u.badgeText !== 'Settled up' && u.netBalance >= 0" class="member-card-bal get">
            +₹{{ u.netBalance | number:'1.0-0' }}
          </span>
          <span *ngIf="u.badgeText !== 'Settled up' && u.netBalance < 0" class="member-card-bal owe">
            -₹{{ -u.netBalance | number:'1.0-0' }}
          </span>
        </div>

      </div>

      <!-- Add Splitter Card -->
      <div class="member-tactile-card add-member-card"
           *ngIf="isNextMonthDisabled"
           (click)="addMember()"
           role="button"
           aria-label="Add splitter">
        <div class="member-avatar-wrapper">
          <div class="member-avatar-ring">
            <div class="member-avatar add-avatar">
              <i class="fa-solid fa-plus"></i>
            </div>
          </div>
        </div>
        <div class="member-meta-block">
          <span class="member-card-name">Add</span>
          <span class="member-card-bal add-text">Splitter</span>
        </div>
      </div>
    </ng-container>
  </div>
</div>

<ng-template #membersSkeleton>
  <div class="member-tactile-card" *ngFor="let i of [1,2,3,4]">
    <div class="member-avatar-wrapper">
      <ion-skeleton-text animated style="width:34px; height:34px; border-radius:50%; margin:0;"></ion-skeleton-text>
    </div>
    <div class="member-meta-block">
      <ion-skeleton-text animated style="width:48px; height:12px; border-radius:4px; margin:0 0 3px 0;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width:36px; height:10px; border-radius:4px; margin:0;"></ion-skeleton-text>
    </div>
  </div>
</ng-template>
