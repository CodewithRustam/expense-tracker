<div class="spend-hero-banner">
  <div class="spend-hero-ambient"></div>
  <ng-container *ngIf="!isLoadingExpenses; else statsSkeleton">
    <div class="spend-main-col">
      <span class="spend-hero-eyebrow">Total Group Spend</span>
      <div class="spend-hero-amount-row">
        <span class="spend-hero-currency">₹</span>
        <h2 class="spend-hero-value">{{ totalAllTime | number:'1.0-0' }}</h2>
      </div>
    </div>

    <div class="spend-hero-pills">
      <div class="spend-stat-pill">
        <i class="fa-solid fa-calculator"></i>
        <span>Avg <strong>₹{{ averageAmount | number:'1.0-0' }}</strong></span>
      </div>
      <div class="spend-stat-pill" *ngIf="memberCount > 0">
        <i class="fa-solid fa-users"></i>
        <span>{{ memberCount }} splitters</span>
      </div>
    </div>
  </ng-container>

  <ng-template #statsSkeleton>
    <div class="spend-main-col" style="gap: 6px;">
      <ion-skeleton-text animated style="width: 105px; height: 11px; border-radius: 4px; margin: 0;"></ion-skeleton-text>
      <div style="display: flex; align-items: baseline; gap: 4px;">
        <ion-skeleton-text animated style="width: 14px; height: 22px; border-radius: 4px; margin: 0;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 130px; height: 28px; border-radius: 6px; margin: 0;"></ion-skeleton-text>
      </div>
    </div>

    <div class="spend-hero-pills" style="gap: 6px;">
      <ion-skeleton-text animated style="width: 96px; height: 25px; border-radius: 999px; margin: 0;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 78px; height: 25px; border-radius: 999px; margin: 0;"></ion-skeleton-text>
    </div>
  </ng-template>
</div>
