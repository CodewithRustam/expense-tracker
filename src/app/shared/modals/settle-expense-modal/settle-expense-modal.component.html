<div class="rev-modal-sheet">
  <!-- Top Handle -->
  <div class="rev-sheet-handle"></div>

  <!-- Header -->
  <div class="rev-sheet-header">
    <span class="rev-sheet-title">Settle Balance</span>
    <button type="button" class="rev-sheet-close" (click)="closeModal()">
      <ion-icon name="close"></ion-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="rev-sheet-scroll">

    <!-- Skeleton Loader -->
    <div *ngIf="isLoading" style="padding: 16px 0;">
      <ion-skeleton-text animated style="width: 100%; height: 44px; margin-bottom: 12px; border-radius: 14px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 100%; height: 44px; margin-bottom: 12px; border-radius: 14px;"></ion-skeleton-text>
    </div>

    <!-- Actual Content -->
    <div *ngIf="!isLoading && user && settlementDetails.length > 0">

      <!-- Payer & Total Balance Info Card -->
      <div class="rev-unified-card" style="margin-bottom: 16px;">
        <div class="rev-card-row">
          <ion-icon name="person-outline" class="rev-row-icon"></ion-icon>
          <div style="flex: 1;">
            <div style="font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase;">Payer</div>
            <div style="font-size: 15px; font-weight: 700; color: var(--ink-1);">{{ user.memberName }}</div>
          </div>
        </div>

        <div class="rev-card-divider"></div>

        <div class="rev-card-row">
          <ion-icon name="wallet-outline" class="rev-row-icon"></ion-icon>
          <div style="flex: 1;">
            <div style="font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase;">Total Balance</div>
            <div style="font-size: 15px; font-weight: 700;" [style.color]="user.netBalance < 0 ? 'var(--debit, #ef4444)' : 'var(--credit, #10b981)'">
              {{ user.netBalance < 0 ? 'Pay ₹' + (-user.netBalance).toFixed(2) : 'No balance due' }}
            </div>
          </div>
        </div>
      </div>

      <!-- Select Member to Settle -->
      <div class="rev-section-label">Select Member to Settle</div>
      <div class="rev-group-pills-row" style="padding-bottom: 20px;">
        <button type="button" *ngFor="let detail of filteredMembers" class="rev-pill-chip"
                [class.active]="selectedMember?.toMemberId === detail.toMemberId"
                (click)="selectedMember = detail; onMemberChange()">
          <span>{{ detail.toMemberName }}</span>
          <span style="font-weight: 800; color: var(--debit, #ef4444); margin-left: 2px;">
            ₹{{ detail.amount.toFixed(2) }}
          </span>
          <ion-icon name="checkmark" *ngIf="selectedMember?.toMemberId === detail.toMemberId"></ion-icon>
        </button>
      </div>

      <!-- Confirm Button -->
      <button type="button" class="rev-primary-btn" [disabled]="!selectedMember" (click)="confirmSettlement()">
        Confirm Settlement
      </button>

    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && settlementDetails.length === 0" style="padding: 32px 16px; text-align: center;">
      <ion-icon name="receipt-outline" style="font-size: 44px; color: var(--ink-3);"></ion-icon>
      <p style="color: var(--ink-3); font-weight: 600; margin-top: 10px; font-size: 14px;">No settlements available.</p>
    </div>

  </div>
</div>
