<div class="rev-modal-sheet">
  <!-- Top Handle -->
  <div class="rev-sheet-handle"></div>

  <!-- Header -->
  <div class="rev-sheet-header rev-stagger-1">
    <span class="rev-sheet-title">Add Member</span>
    <button type="button" class="rev-sheet-close" (click)="dismiss()">
      <ion-icon name="close"></ion-icon>
    </button>
  </div>

  <!-- Scrollable Sheet Content -->
  <div class="rev-sheet-scroll">

    <!-- Group Context Tag (if group name available) -->
    <div class="rev-split-pill-badge rev-stagger-2" *ngIf="roomName" style="margin: 4px 0 12px; align-self: flex-start;">
      <ion-icon name="people-outline"></ion-icon>
      <span>{{ roomName }}</span>
    </div>

    <div class="rev-modal-subtitle rev-stagger-2">Invite someone to this group by name and email</div>

    <form [formGroup]="memberForm" (ngSubmit)="onAddMember()">

      <!-- Unified Inset Details Card -->
      <div class="rev-unified-card rev-stagger-3">
        <!-- Name Row -->
        <div class="rev-card-row">
          <ion-icon name="person-outline" class="rev-row-icon"></ion-icon>
          <input type="text" placeholder="Full Name" formControlName="name" class="rev-row-input" />
        </div>
        <div class="rev-input-error" *ngIf="f['name'].invalid && f['name'].touched" style="padding: 0 16px 8px; text-align: left;">
          <span *ngIf="f['name'].errors?.['required']">Name is required.</span>
          <span *ngIf="f['name'].errors?.['minlength']">Name must be at least 2 characters.</span>
          <span *ngIf="f['name'].errors?.['maxlength']">Name cannot exceed 50 characters.</span>
          <span *ngIf="f['name'].errors?.['pattern']">Name can only contain letters and spaces.</span>
        </div>

        <div class="rev-card-divider"></div>

        <!-- Email Row -->
        <div class="rev-card-row">
          <ion-icon name="mail-outline" class="rev-row-icon"></ion-icon>
          <input type="email" placeholder="Email Address" formControlName="email" class="rev-row-input" />
        </div>
        <div class="rev-input-error" *ngIf="f['email'].invalid && f['email'].touched" style="padding: 0 16px 8px; text-align: left;">
          <span *ngIf="f['email'].errors?.['required']">Email is required.</span>
          <span *ngIf="f['email'].errors?.['email'] || f['email'].errors?.['pattern']">Please enter a valid email format.</span>
        </div>
      </div>

      <!-- Server Error -->
      <div class="rev-input-error" *ngIf="serverErrorMsg" style="margin-bottom: 12px; font-size: 13px;">{{ serverErrorMsg }}</div>

      <!-- Primary Action Button -->
      <button type="submit" class="rev-primary-btn rev-stagger-4" [disabled]="isAddDisabled">
        <span *ngIf="!isSubmitting">Add Member</span>
        <ion-spinner name="crescent" *ngIf="isSubmitting"></ion-spinner>
      </button>

    </form>

  </div>
</div>
