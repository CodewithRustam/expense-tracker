<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-title>Scan UPI QR Code</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="scanner-content">
  <div class="scanner-wrapper">
    <!-- Camera Viewport container for html5-qrcode -->
    <div id="qr-reader" class="qr-viewport"></div>

    <!-- Scanner Overlay HUD -->
    <div class="scanner-hud" *ngIf="isScanning">
      <div class="target-box">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
        <div class="scan-line"></div>
      </div>
      <p class="scan-instruction">Align Google Pay / PhonePe QR code inside the frame</p>
    </div>

    <!-- Error State -->
    <div *ngIf="errorMessage" class="error-container">
      <ion-icon name="alert-circle-outline" style="font-size: 48px; color: var(--ion-color-danger);"></ion-icon>
      <p>{{ errorMessage }}</p>
      <ion-button fill="outline" color="light" (click)="startScanner()" style="margin-top: 16px;">
        Retry Camera
      </ion-button>
    </div>
  </div>
</ion-content>
